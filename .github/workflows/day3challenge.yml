name: Day 3 Challenge (Artifacts/Secrets)


on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5

    - name: install build
      run: |
       pip install build
       python -m build
    - uses: actions/upload-artifact@v4
      with:
        name: package
        path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: dist/
      - name: Deploy with key
      env:
        API_KEY: ${{ secrets.API_KEY }}
        run: |
          ls-la dist/
          echo "Deploying with key: ${API_KEY:+SET}"



